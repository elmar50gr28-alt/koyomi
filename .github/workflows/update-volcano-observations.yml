name: Update volcano observations
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: update-volcano-observations
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh verified observations
        env:
          NASA_FIRMS_MAP_KEY: ${{ secrets.NASA_FIRMS_MAP_KEY }}
        run: node scripts/update-gvp-volcano-catalog.mjs && node scripts/update-volcano-observations.mjs && node scripts/update-jma-volcano-alerts.mjs
      - name: Verify safety and regressions
        run: node tests/volcano-live-observations.test.mjs && node tests/jma-volcano-alert-ingestion.test.mjs && npm run test:mundane
      - name: Publish verified data update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/world/volcano-catalog-v2.json data/world/volcano-observations-v1.json data/world/volcano-official-alerts-v1.json; then exit 0; fi
          branch="automation/volcano-observations-$(date -u +%Y%m%d%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/world/volcano-catalog-v2.json data/world/volcano-observations-v1.json data/world/volcano-official-alerts-v1.json
          git commit -m "Update verified volcano observations and alerts"
          git push origin "$branch"
          pr_url=$(gh pr create --base main --head "$branch" --title "Update verified volcano observations and alerts" --body "Automated NASA FIRMS, USGS and JMA refresh passed completeness, safety and world regression tests.")
          gh pr merge "$pr_url" --squash --delete-branch
